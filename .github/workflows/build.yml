name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the installer
        run: npm run dist
        env:
          # Optional code signing: add these repository secrets and the installer is signed (removes the SmartScreen warning).
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Setup
          path: dist/Mochi-Setup-*.exe
      - name: Attach to the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mochi-Setup-*.exe
