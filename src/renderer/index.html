<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Nothing remote is ever loaded. 'unsafe-inline' styles are needed for generated SVG/tile styling only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>mochi</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="views/home.css">
  <link rel="stylesheet" href="views/panels.css">
</head>
<body>
  <!-- album-art bubble beside the collapsed notch -->
  <div id="bubble"><div class="bart" id="bart"></div></div>
  <div id="notch">
    <div class="gradient"></div>
    <div class="gradient gradient-alt"></div>
    <div class="eyes" id="eyes"></div>
    <!-- collapsed Focus timer: ring on the left, time on the right -->
    <svg id="cring" viewBox="0 0 20 20"><circle class="cr-track" cx="10" cy="10" r="7"/><circle class="cr-arc" id="cr-arc" cx="10" cy="10" r="7" transform="rotate(-90 10 10)"/></svg>
    <span id="ctime"></span>
    <div class="content" id="content"></div>
  </div>
  <script src="components/icons.js"></script>
  <script src="components/chime.js"></script>
  <script src="components/focus.js"></script>
  <script src="components/mochi.js"></script>
  <script src="components/laptop-scene.js"></script>
  <script src="components/progress.js"></script>
  <script src="components/nav.js"></script>
  <script src="components/md.js"></script>
  <script src="components/typing.js"></script>
  <script src="components/personality.js"></script>
  <script src="views/home.js"></script>
  <script src="views/working.js"></script>
  <script src="views/done.js"></script>
  <script src="views/needs.js"></script>
  <script src="views/claude-idle.js"></script>
  <script src="views/music.js"></script>
  <script src="views/focus.js"></script>
  <script src="views/break.js"></script>
  <script src="views/chat.js"></script>
  <script src="views/notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
